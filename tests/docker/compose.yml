# Real ssh tests against a throwaway OpenSSH server.
# Run through scripts/ssh-docker-test.sh (it makes the key pair in HDIR_KEYS).
services:
  sshd:
    build: ./sshd
    volumes:
      - ${HDIR_KEYS:?run scripts/ssh-docker-test.sh}:/keys:ro
  client:
    image: rust:1-bookworm
    depends_on: [sshd]
    working_dir: /src
    environment:
      CARGO_TARGET_DIR: /target
      HDIR_SSH_HOST: hdir@sshd
    volumes:
      - ../..:/src:ro
      - ${HDIR_KEYS}:/keys:ro
      - target:/target
      - registry:/usr/local/cargo/registry
    command:
      - sh
      - -euc
      - |
        install -d -m 700 ~/.ssh
        install -m 600 /keys/id ~/.ssh/id_ed25519
        n=0
        until ssh-keyscan -T 2 sshd > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; do
          n=$$((n + 1)); [ "$$n" -lt 30 ] || { echo 'sshd did not come up' >&2; exit 1; }
          sleep 1
        done
        cargo test --locked --test ssh_real -- --ignored
volumes:
  target:
  registry:
