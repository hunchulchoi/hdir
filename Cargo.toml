[package]
name = "hdir"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
trash = "5.2.9"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"]
